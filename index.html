<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPAS AI 應用規劃師 - 互動測驗系統</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --border: #e2e8f0;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 700;
    }
    .config-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .config-box input {
      width: calc(100% - 100px);
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .config-box button {
      padding: 6px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .nav-tabs button {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-tabs button.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      padding: 14px 18px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0f7ff;
    }
    .option-btn.correct {
      background: #dcfce7 !important;
      border-color: var(--success) !important;
      color: #14532d;
      font-weight: 600;
    }
    .option-btn.wrong {
      background: #fee2e2 !important;
      border-color: var(--danger) !important;
      color: #7f1d1d;
    }
    .explanation {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      display: none;
    }
    .sync-status {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .action-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      font-size: 0.85rem;
    }
    th {
      background: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>iPAS AI 應用規劃師（初級）</h1>
      <div class="nav-tabs">
        <button id="btn-quiz-mode" class="active" onclick="switchMode('quiz')">順序測驗</button>
        <button id="btn-wrong-mode" onclick="switchMode('wrong')">錯題本 (<span id="wrong-count">0</span>)</button>
      </div>
    </header>

    <div class="config-box">
      <strong>🔗 自動同步試算表：</strong>
      <input type="text" id="gas-url" placeholder="貼上 Google Apps Script 網頁應用程式網址 (留空則純本地記錄)">
      <button onclick="saveGasUrl()">儲存網址</button>
    </div>

    <div id="quiz-section">
      <div class="card">
        <span class="badge" id="q-category">考科一：人工智慧基礎概論</span>
        <div class="question-title" id="q-text">載入題目中...</div>
        <div class="options" id="q-options"></div>
        <div class="explanation" id="q-explanation"></div>
        <div class="sync-status" id="q-sync-status"></div>
      </div>
      <div class="actions">
        <button class="action-btn" id="btn-prev" onclick="navigate(-1)">上一題</button>
        <span id="q-index" style="align-self: center; font-weight: 600;">1 / 10</span>
        <button class="action-btn" id="btn-next" onclick="navigate(1)">下一題</button>
      </div>
    </div>

    <div id="wrong-section" style="display: none;">
      <div class="card">
        <h2 style="font-size: 1.1rem; margin-top: 0;">歷史答錯題目清單</h2>
        <div id="wrong-list-content">目前尚無錯題紀錄！</div>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "L111 人工智慧概念與治理",
        question: "某食品工廠的輸送帶依固定時間每 10 分鐘啟動一次；另一套系統則會根據影像判斷包裝是否破損，並隨新資料更新判斷規則。下列敘述何者最適當？",
        options: [
          "兩套系統都必然屬於 AI",
          "前者偏固定規則自動化，後者具資料學習與判斷特性",
          "只有前者屬 AI，因為它能自動執行",
          "是否屬 AI 只取決於運算速度"
        ],
        answer: 1,
        explanation: "固定排程能自動執行，但不必然具有學習、推論或適應能力；影像系統從資料中建立判斷模型，符合 AI 的核心特徵。"
      },
      {
        id: 2,
        category: "L111 人工智慧概念與治理",
        question: "連鎖書店依過去三年的銷售、節慶與天氣資料，估計下個月各門市的童書需求量。此任務主要屬於哪一類 AI？",
        options: ["分析型 AI", "生成型 AI", "預測型 AI", "規則式排程，不涉及 AI"],
        answer: 2,
        explanation: "任務輸出是尚未發生的未來需求量，核心在利用歷史資料預測未來，因此屬預測型 AI。"
      },
      {
        id: 3,
        category: "L111 人工智慧概念與治理",
        question: "一套 AI 可翻譯多國語言、摘要文件並回答問題，但無法自行設定跨領域人生目標，也不具一般人類在所有任務上的適應能力。依能力範圍分類，最合理的判斷為何？",
        options: [
          "仍屬狹義人工智慧（ANI）",
          "已屬通用人工智慧（AGI）",
          "已屬超人工智慧（ASI）",
          "只要能做多項任務就不能稱為 AI"
        ],
        answer: 0,
        explanation: "目前商用生成式 AI 雖可執行多種相關任務，仍是在訓練與設計範圍內運作，未達全面通用智能，仍屬 ANI。"
      },
      {
        id: 4,
        category: "L111 人工智慧概念與治理",
        question: "某公司將客服模型委外建置。上線後出現錯誤退費建議，內部主管表示「模型由供應商提供，所以本公司不需負責」。依 AI 治理觀念，何者最適當？",
        options: [
          "只要合約未寫明，公司即可免責",
          "錯誤由模型自行承擔",
          "只需要求供應商公開模型參數",
          "使用 AI 的組織仍應建立責任分工、監督與申訴機制"
        ],
        answer: 3,
        explanation: "委外不等於免除責任。導入與使用 AI 的組織須明確分工、持續監控、保存紀錄，並提供人工處理與申訴管道。"
      },
      {
        id: 5,
        category: "L111 人工智慧概念與治理",
        question: "大學使用 AI 協助判斷獎學金申請資料是否齊全，但涉及資格認定或退件時，必須由承辦人檢視證據後決定。這最符合哪一種設計？",
        options: [
          "Human-in-the-loop，人員保留關鍵決策權",
          "完全自主 AI，不需人工參與",
          "非監督式學習",
          "資料去識別化"
        ],
        answer: 0,
        explanation: "AI 處理初步篩選，人員在高風險/關鍵節點審核並作成決定，屬於典型的 Human-in-the-loop 機制。"
      },
      {
        id: 6,
        category: "L111 人工智慧概念與治理",
        question: "銀行的 AI 拒絕某客戶貸款，客服只能回答「系統判定未通過」，無法說明主要影響因素，也沒有人工複核管道。最直接涉及哪一治理缺口？",
        options: [
          "模型運算速度不足",
          "資料量一定太少",
          "缺乏透明、可解釋及救濟機制",
          "未採用生成式 AI"
        ],
        answer: 2,
        explanation: "高影響決策應讓受影響者了解 AI 使用情形、主要依據與限制，並具備可請求人員複核或申訴的救濟機制。"
      },
      {
        id: 7,
        category: "L111 人工智慧概念與治理",
        question: "保險模型未直接使用族群欄位，卻使用居住郵遞區號，結果對特定族群的費率明顯較高。最適當的判斷為何？",
        options: [
          "未使用族群欄位，因此不可能有偏見",
          "郵遞區號可能成為代理變數，仍需做公平性與差異影響檢查",
          "只要整體準確率高即可忽略群體差異",
          "刪除所有地理資料即可證明公平"
        ],
        answer: 1,
        explanation: "看似中性的欄位若與敏感特徵高度相關，會成為「代理變數（Proxy Variable）」造成間接偏見，必須做差異影響檢查。"
      },
      {
        id: 8,
        category: "L112 資料處理與分析",
        question: "健身 App 原先蒐集心率資料供個人運動回饋，後來未另行告知就把資料交給合作廠商訓練保險定價模型。首要風險為何？",
        options: [
          "資料格式不是 CSV",
          "模型可能訓練太慢",
          "心率資料無法用於機器學習",
          "資料使用超出原告知目的，涉及隱私與合法性"
        ],
        answer: 3,
        explanation: "個人資料必須符合「目的限制原則」，超出原本告知的使用範圍時，涉及嚴重的隱私與法規授權風險。"
      },
      {
        id: 9,
        category: "L111 人工智慧概念與治理",
        question: "某機構同時使用 AI 整理會議逐字稿及協助判斷急診病患優先順序。治理資源有限時，最合理的配置原則為何？",
        options: [
          "依可能傷害與影響程度分級，對醫療排序設更嚴格控制",
          "兩者使用相同控制，因為都是 AI",
          "先管會議摘要，因為文字較長",
          "只看供應商價格決定風險"
        ],
        answer: 0,
        explanation: "風險導向治理（Risk-based approach）主張依可能造成的傷害程度與影響範圍進行分級管控。"
      },
      {
        id: 10,
        category: "L111 人工智慧概念與治理",
        question: "零售需求模型上線半年後，因消費型態改變而預測誤差持續升高。下列何者最符合治理生命週期的處理方式？",
        options: [
          "永久沿用原模型以維持一致",
          "只增加伺服器記憶體",
          "監測資料與效能漂移，必要時重新訓練、驗證及版本控管",
          "刪除所有歷史資料後立即上線新模型"
        ],
        answer: 2,
        explanation: "上線後需持續監控模型漂移（Model Drift），當分佈或行為改變導致效能下降時，應重新訓練、驗證並做好版本控管。"
      }
    ];

    let currentIndex = 0;
    let mode = 'quiz';
    let wrongBook = JSON.parse(localStorage.getItem('ipas_wrong_book') || '{}');

    function saveGasUrl() {
      const url = document.getElementById('gas-url').value.trim();
      localStorage.setItem('ipas_gas_url', url);
      alert('後台網址已儲存！');
    }

    function initGasUrl() {
      const url = localStorage.getItem('ipas_gas_url') || '';
      document.getElementById('gas-url').value = url;
    }

    function updateWrongBadge() {
      document.getElementById('wrong-count').textContent = Object.keys(wrongBook).length;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-category').textContent = q.category;
      document.getElementById('q-text').textContent = `第 ${q.id} 題｜${q.question}`;
      document.getElementById('q-index').textContent = `${currentIndex + 1} / ${questions.length}`;
      
      const optionsContainer = document.getElementById('q-options');
      const explanationEl = document.getElementById('q-explanation');
      const syncStatusEl = document.getElementById('q-sync-status');
      optionsContainer.innerHTML = '';
      explanationEl.style.display = 'none';
      syncStatusEl.textContent = '';

      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `(${letters[idx]}) ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
      updateWrongBadge();
    }

    function checkAnswer(selectedIdx) {
      const q = questions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      const explanationEl = document.getElementById('q-explanation');
      const syncStatusEl = document.getElementById('q-sync-status');
      const isCorrect = selectedIdx === q.answer;

      buttons[selectedIdx].classList.add(isCorrect ? 'correct' : 'wrong');
      if (!isCorrect) {
        buttons[q.answer].classList.add('correct');
        wrongBook[q.id] = {
          id: q.id,
          category: q.category,
          question: q.question,
          myChoice: ['A','B','C','D'][selectedIdx],
          correct: ['A','B','C','D'][q.answer],
          explanation: q.explanation
        };
      } else {
        delete wrongBook[q.id];
      }
      localStorage.setItem('ipas_wrong_book', JSON.stringify(wrongBook));
      updateWrongBadge();

      explanationEl.innerHTML = `
        <strong>${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'}</strong><br>
        <strong>正確答案：</strong>(${['A','B','C','D'][q.answer]})<br>
        <strong>考點解析：</strong>${q.explanation}
      `;
      explanationEl.style.display = 'block';

      const gasUrl = localStorage.getItem('ipas_gas_url');
      if (gasUrl) {
        syncStatusEl.textContent = '⏳ 正在寫入 Google 試算表...';
        fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: '考科一',
            qId: q.id,
            category: q.category,
            question: q.question,
            myChoice: ['A','B','C','D'][selectedIdx],
            correctAnswer: ['A','B','C','D'][q.answer],
            isCorrect: isCorrect,
            explanation: q.explanation
          })
        }).then(() => {
          syncStatusEl.textContent = '✅ 已成功同步寫入試算表！';
        }).catch(err => {
          syncStatusEl.textContent = '⚠️ 寫入失敗，請確認後台網址。';
        });
      }
    }

    function navigate(delta) {
      currentIndex += delta;
      renderQuestion();
    }

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById('btn-quiz-mode').classList.toggle('active', mode === 'quiz');
      document.getElementById('btn-wrong-mode').classList.toggle('active', mode === 'wrong');

      if (mode === 'quiz') {
        document.getElementById('quiz-section').style.display = 'block';
        document.getElementById('wrong-section').style.display = 'none';
        renderQuestion();
      } else {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('wrong-section').style.display = 'block';
        renderWrongList();
      }
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-content');
      const list = Object.values(wrongBook);
      if (list.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">太棒了！目前沒有錯題紀錄。</p>';
        return;
      }
      let html = `<table>
        <thead>
          <tr>
            <th>題號</th>
            <th>考點</th>
            <th>題目摘要</th>
            <th>你的答案</th>
            <th>正解</th>
            <th>解析</th>
          </tr>
        </thead>
        <tbody>`;
      list.forEach(item => {
        html += `<tr>
          <td>${item.id}</td>
          <td>${item.category}</td>
          <td>${item.question.slice(0, 18)}...</td>
          <td style="color:red;font-weight:bold;">${item.myChoice}</td>
          <td style="color:green;font-weight:bold;">${item.correct}</td>
          <td>${item.explanation}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    initGasUrl();
    renderQuestion();
  </script>
</body>
</html>
